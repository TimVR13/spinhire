# Drop-in для spinhire.service (веб-процесс). Ставится deploy/install-guard.sh как
# /etc/systemd/system/spinhire.service.d/guard.conf.
#
# Зачем (15.09.2026): фоновый поток внутри uvicorn раздул процесс, сервер ушёл в своп,
# сайт не отвечал, а graceful stop зависшего event loop ждал 90 секунд. Теперь:
#  - веб-процесс не запускает фоновые потоки (SPINHIRE_ROLE=web) — они в spinhire-worker.service;
#  - память ограничена: выше MemoryMax ядро убивает процесс, systemd поднимает новый за 2 с,
#    а не тянет весь сервер в своп; MemorySwapMax не даёт процессу «жить» в свопе;
#  - остановка зависшего процесса — 12 с, дальше SIGKILL;
#  - приоритет CPU и памяти выше соседей на общем дроплете: под нагрузкой и при OOM
#    страдают они, а не сайт.
# Заменяет прежний limits.conf (MemoryMax=1500M, TimeoutStopSec=20): один drop-in вместо двух,
# чтобы значения не спорили — install-guard.sh убирает limits.conf с сервера.
[Service]
Environment=SPINHIRE_ROLE=web
MemoryLow=300M
MemoryHigh=800M
MemoryMax=1000M
MemorySwapMax=300M
OOMPolicy=kill
OOMScoreAdjust=-400
CPUWeight=400
TimeoutStopSec=12
TimeoutStartSec=120
Restart=always
RestartSec=2
