# Drop-in для spinhire.service: /etc/systemd/system/spinhire.service.d/limits.conf
# Установка: scp deploy/limits.conf root@165.232.79.152:/etc/systemd/system/spinhire.service.d/ && systemctl daemon-reload
#
# 15.09.2026: процесс раздулся до 1 ГБ (40 потоков одновременно грузили всю таблицу
# вакансий с описаниями), утащил машину в своп и 20 минут не отвечал; остановка по
# SIGTERM ждала 90 секунд. Лучше OOM-kill и рестарт за 3 секунды (сокет держит порт),
# чем мёртвый сайт.
[Service]
MemoryMax=1500M
TimeoutStopSec=20
