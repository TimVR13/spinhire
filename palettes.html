<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpinHire — 8 неоновых гамм</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0710; color: #f3f0f7; font-family: "Golos Text", sans-serif; padding: 32px 20px 60px; }
  .head { max-width: 1200px; margin: 0 auto 28px; }
  .head h1 { font-family: "Unbounded", sans-serif; font-weight: 900; text-transform: uppercase; font-size: clamp(1.6rem, 4vw, 2.4rem); }
  .head p { color: #a9a3b5; margin-top: 8px; }
  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .pal { border: 1px solid #241f30; border-radius: 16px; overflow: hidden; background: var(--bg); }
  .pal-top { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .pal-name { font-family: "Unbounded", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 0.95rem; }
  .num { font-family: "Unbounded", sans-serif; font-weight: 900; color: var(--acc); }
  .swatches { display: flex; gap: 6px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; }
  .pal-body { padding: 20px; }
  .pal-body .kick { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: var(--acc); }
  .pal-body h2 { font-family: "Unbounded", sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1.5rem; line-height: 1.05; margin: 6px 0 4px; }
  .pal-body h2 em { font-style: normal; color: var(--acc); }
  .pal-body h2 .s2 { color: var(--acc2); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .btn { font-family: "Golos Text"; font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.03em; padding: 9px 16px; border-radius: 9px; border: none; }
  .btn-acc { background: var(--acc); color: var(--on-acc); }
  .btn-acc2 { background: var(--acc2); color: var(--on-acc2); }
  .btn-ghost { background: transparent; color: var(--txt); border: 1px solid var(--line2); }
  .tag { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; padding: 3px 9px; border-radius: 6px; }
  .tag-a { color: var(--acc); background: color-mix(in oklch, var(--acc) 14%, transparent); }
  .tag-b { color: var(--acc2); background: color-mix(in oklch, var(--acc2) 16%, transparent); }
  .jc { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; display: flex; gap: 12px; align-items: center; }
  .jc .lg { width: 40px; height: 40px; border-radius: 9px; background: var(--acc); display: grid; place-items: center; font-family: "Unbounded"; font-weight: 900; color: var(--on-acc); font-size: 0.9rem; flex-shrink: 0; }
  .jc .t { font-weight: 600; font-size: 0.9rem; }
  .jc .m { color: #8f899c; font-size: 0.75rem; }
  .jc .sal { margin-left: auto; font-family: "Unbounded"; font-weight: 800; color: var(--acc); font-size: 0.9rem; }
  .glow { box-shadow: 0 6px 26px color-mix(in oklch, var(--acc) 22%, transparent); }
</style>
</head>
<body>
  <div class="head">
    <h1>SpinHire — 8 неоновых гамм</h1>
    <p>Каждая показана на реальных элементах: акцент-заголовок, кнопки, теги, карточка вакансии. Тёмная база везде. Кислотный лайм убран. Скажите номер — применю на весь сайт.</p>
  </div>
  <div class="grid" id="grid"></div>

<script>
const palettes = [
  { name: "1 · Неон-магента", bg:"#0c0810", surface:"#16101c", line:"#2a1f33", line2:"#463356", txt:"#f3eef7",
    acc:"#ff2d9c", onAcc:"#1a0512", acc2:"#22d3ee", onAcc2:"#062a30", note:"Хот-пинк + циан. Дерзко, современно." },
  { name: "2 · Электрик-циан", bg:"#070e12", surface:"#0f1a20", line:"#1c2e38", line2:"#325668", txt:"#eef6fa",
    acc:"#22e0ff", onAcc:"#04222b", acc2:"#ff3d7f", onAcc2:"#2a0714", note:"Электрический голубой + розовый. Технологично, дорого." },
  { name: "3 · Неон-фиолет", bg:"#0c0814", surface:"#160f22", line:"#291d3d", line2:"#4a3568", txt:"#f2eefa",
    acc:"#a855ff", onAcc:"#1a0630", acc2:"#22d3ee", onAcc2:"#062a30", note:"Пурпур + циан. Премиум-мистика, синтвейв." },
  { name: "4 · Казино-голд", bg:"#0e0a06", surface:"#1a140c", line:"#2f2413", line2:"#574222", txt:"#f7f1e6",
    acc:"#ffb020", onAcc:"#241703", acc2:"#ff3b30", onAcc2:"#2a0705", note:"Золото + красный. Классика казино, богато." },
  { name: "5 · Изумруд-неон", bg:"#070f0c", surface:"#0f1a15", line:"#1c2e26", line2:"#315648", txt:"#ecf7f1",
    acc:"#00e39a", onAcc:"#032a1d", acc2:"#ffb020", onAcc2:"#241703", note:"Глубокий изумруд (не кислота) + золото. Деньги, статус." },
  { name: "6 · Неон-краснрубин", bg:"#0f0709", surface:"#1c0f13", line:"#331d22", line2:"#5c333c", txt:"#faeef0",
    acc:"#ff3b5c", onAcc:"#2a0710", acc2:"#ffab20", onAcc2:"#241703", note:"Рубин + янтарь. Азарт, страсть, ставки." },
  { name: "7 · Аква-мята", bg:"#06100f", surface:"#0e1b1a", line:"#1b2f2d", line2:"#2f5651", txt:"#ecf8f6",
    acc:"#2af0d4", onAcc:"#04302a", acc2:"#c7ff3d", onAcc2:"#1a2405", note:"Бирюза + лайм-акцент. Свежо, но мягче кислоты." },
  { name: "8 · Дуо пинк+циан", bg:"#0a0812", surface:"#141020", line:"#261d38", line2:"#443563", txt:"#f2eefb",
    acc:"#ff36b0", onAcc:"#2a0720", acc2:"#3ad8ff", onAcc2:"#052833", note:"Двойной неон, градиенты pink→cyan. Максимум вау." },
];
document.getElementById('grid').innerHTML = palettes.map(p => `
  <div class="pal" style="--bg:${p.bg};--surface:${p.surface};--line:${p.line};--line2:${p.line2};--txt:${p.txt};--acc:${p.acc};--on-acc:${p.onAcc};--acc2:${p.acc2};--on-acc2:${p.onAcc2}">
    <div class="pal-top">
      <span class="pal-name">${p.name}</span>
      <div class="swatches"><span class="sw" style="background:${p.acc}"></span><span class="sw" style="background:${p.acc2}"></span><span class="sw" style="background:${p.surface};border:1px solid ${p.line2}"></span></div>
    </div>
    <div class="pal-body">
      <span class="kick">▮▮ Джоб-борд iGaming</span>
      <h2>Иди <em>ва-банк</em>. <span class="s2">120+</span> вакансий</h2>
      <div class="row">
        <button class="btn btn-acc glow">Найти вакансии</button>
        <button class="btn btn-acc2">Разместить</button>
        <button class="btn btn-ghost">Войти</button>
      </div>
      <div class="row">
        <span class="tag tag-a">VIP-менеджер</span>
        <span class="tag tag-a">Релокация</span>
        <span class="tag tag-b">₿ Крипто</span>
      </div>
      <div class="jc">
        <div class="lg">BG</div>
        <div><div class="t">Head of Casino</div><div class="m">Betsson · Мальта · гибрид</div></div>
        <span class="sal">€8–12K</span>
      </div>
      <p style="color:#8f899c;font-size:0.78rem;margin-top:12px">${p.note}</p>
    </div>
  </div>`).join('');
</script>
</body>
</html>
