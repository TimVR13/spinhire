{% extends "base.html" %}
{% block title %}Регистрация — SpinHire{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
  <div style="max-width: 460px; margin: 40px auto;">
    <span class="kicker">Входи в игру</span>
    <h1 style="font-size: 1.8rem; margin-block: 8px 24px;">Регистрация</h1>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <a class="btn btn-ghost btn-block" id="google-register" data-next="{{ next or '' }}" href="/auth/google?role={{ role }}{% if next %}&amp;next={{ next|urlencode }}{% endif %}" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px;">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
      Войти через Google
    </a>
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--ink-faint); font-size: 0.8rem;">
      <span style="flex: 1; height: 1px; background: var(--line);"></span>— или —<span style="flex: 1; height: 1px; background: var(--line);"></span>
    </div>
    <form method="post" action="/register" class="card" style="display: flex; flex-direction: column; gap: 16px;">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <div class="role-switch" style="margin: 0;">
        <button type="button" class="{% if role != 'employer' %}active{% endif %}" onclick="setRole('talent', this)">Ищу работу</button>
        <button type="button" class="{% if role == 'employer' %}active{% endif %}" onclick="setRole('employer', this)">Нанимаю</button>
      </div>
      <input type="hidden" name="role" id="role-input" value="{{ role }}">
      <div class="field"><label for="reg-name">Имя{% if role == 'employer' %} / контактное лицо{% endif %}</label><input class="input" id="reg-name" name="name" autocomplete="name"></div>
      <div class="field" id="company-field" {% if role != 'employer' %}style="display:none;"{% endif %}>
        <label for="reg-company">Название компании</label><input class="input" id="reg-company" name="company_name" autocomplete="organization" placeholder="например, BetOnyx Ltd">
      </div>
      <div class="field"><label for="reg-email">Email</label><input class="input" id="reg-email" type="email" name="email" value="{{ email or '' }}" autocomplete="email" required {% if email %}readonly{% endif %}></div>
      <div class="field"><label for="reg-pw">Пароль (от 6 символов)</label><input class="input" id="reg-pw" type="password" name="password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn btn-acid btn-block" type="submit">Создать аккаунт →</button>
    </form>
    <p style="margin-top: 16px; color: var(--ink-dim); text-align: center;">Уже есть аккаунт? <a href="/login" style="color: var(--acid);">Войти</a></p>
  </div>
  <script>
    function setRole(r, btn) {
      document.getElementById('role-input').value = r;
      document.querySelectorAll('.role-switch button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('company-field').style.display = r === 'employer' ? '' : 'none';
      const google = document.getElementById('google-register');
      const next = google.dataset.next;
      google.href = '/auth/google?role=' + encodeURIComponent(r) + (next ? '&next=' + encodeURIComponent(next) : '');
    }
  </script>
{% endblock %}
