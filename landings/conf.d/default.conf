# SpinHire outreach landings: три домена под холодную рассылку.
# Контейнер spinhire-landings (nginx:alpine) в сети coex_default, TLS терминирует coex-caddy.
# Корень выбирается по Host; неизвестный хост получает карточку spinhire.org.
map $host $landing_root {
  default                       /usr/share/nginx/html/spinhire.org;
  ~^(www\.)?spinrecruit\.com$   /usr/share/nginx/html/spinrecruit.com;
  ~^(www\.)?spinhires\.com$     /usr/share/nginx/html/spinhires.com;
  ~^(www\.)?spinhire\.org$      /usr/share/nginx/html/spinhire.org;
}

server {
  listen 80;
  server_name _;
  root $landing_root;
  index index.html;
  charset utf-8;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
  }
  location = /healthz { default_type text/plain; return 200 "ok\n"; }

  # любой путь показывает лендинг: у домена одна страница
  location / { try_files $uri /index.html; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;
}
