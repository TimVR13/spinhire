<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;width:800px;height:800px;overflow:hidden;background:#0b0f0e}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, #17231f 0%, #0b0f0e 70%)}
.glow{position:absolute;left:50%;top:44%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(0,223,170,.26) 0%, rgba(0,223,170,0) 62%)}
.g{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
/* корпус слота в SVG занимает x 3–97 из 120 (центр 50), рычаг торчит справа до 116.
   сдвигаем картинку вправо на (60-50)/120 её ширины, чтобы по центру был корпус, а не bbox */
.m{width:560px;transform:translateX(8.3%)}
.w{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em;color:#f4f4f6}
.w b{color:#3cf0c2}
</style><div class="bg"></div><div class="glow"></div>
<div class="g"><img class="m" src="spinhire-slot.svg"><div class="w">spin<b>hire</b></div></div>
